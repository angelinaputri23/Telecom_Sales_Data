<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Telecom Sales — App vs POS</title><link rel="stylesheet" href="style.css"></head>
<body><div class="wrap"><div id="shell"></div><div id="page"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="core.js"></script><script src="snapshot.js"></script><script src="shared.js"></script>
<script>
const Page = { file: 'channel.html', title: 'App vs POS', ch: false,
render() {
  const f = Shell.f(), w = Data.series(f.store, 'all', f.dedupe);
  if (!Data.hasApp) { $('page').innerHTML = `<div class="card empty"><b>No App sales data yet.</b><br>The current file only has one sales channel (store/POS) per branch, so App vs POS cannot be compared without guessing.<br>Add a tab per store named like <code>30002 MF APP</code> (same report layout), add it to <code>CFG.tabs</code> in shared.js, or upload an Excel file that contains those tabs.</div>`; Object.values(Shell.charts).forEach(c => c.destroy()); Shell.charts = {}; return; }
  const d = w.filter(x => x.complete), g = k => { const a = d.slice(-4).reduce((s, x) => s + x[k] * 7 / x.days, 0) / 4, b = d.slice(-8, -4).reduce((s, x) => s + x[k] * 7 / x.days, 0) / 4; return [a, b ? a / b - 1 : null]; };
  const [pa, pg] = g('pos'), [aa, ag] = g('app'), base = k => { const h = d.slice(0, 4); return h.reduce((s, x) => s + x[k] * 7 / x.days, 0) / (h.length || 1) || 1; };
  $('page').innerHTML = `<div class="kpis">${U.kpi('POS — last 4 wks avg', U.n(pa) + ' pcs/wk', 'vs prior 4 wks ' + U.pc(pg))}${U.kpi('App — last 4 wks avg', U.n(aa) + ' pcs/wk', 'vs prior 4 wks ' + U.pc(ag))}${U.kpi('App share (last 4 wks)', (aa / (aa + pa) * 100).toFixed(1) + '%', 'of App + POS pcs')}</div>
  <div class="grid"><div class="card"><h3>Pcs per week: POS vs App</h3><div class="ch"><canvas id="c1"></canvas></div></div><div class="card"><h3>Index (first 4 full weeks = 100)</h3><div class="ch"><canvas id="c2"></canvas></div></div></div>
  <div class="card sc"><h3>Weekly table</h3><table><tr><th>Week</th><th>POS</th><th>App</th><th>App share</th></tr>${w.map(x => `<tr><td>${Core.iso(x.s)} → ${Core.iso(x.e)}${x.complete ? '' : ' †'}</td><td>${U.n(x.pos)}</td><td>${U.n(x.app)}</td><td>${x.pcs ? (x.app / x.pcs * 100).toFixed(1) + '%' : '–'}</td></tr>`).join('')}</table><div class="note">${U.foot}</div></div>`;
  Shell.chart('c1', { type: 'line', data: { labels: w.map(U.lbl), datasets: [{ label: 'POS', data: w.map(x => x.pos), borderColor: '#2a6df4', tension: .25 }, { label: 'App', data: w.map(x => x.app), borderColor: '#16a06b', tension: .25 }] } });
  Shell.chart('c2', { type: 'line', data: { labels: d.map(U.lbl), datasets: [{ label: 'POS', data: d.map(x => x.pos * 7 / x.days / base('pos') * 100), borderColor: '#2a6df4', tension: .25 }, { label: 'App', data: d.map(x => x.app * 7 / x.days / base('app') * 100), borderColor: '#16a06b', tension: .25 }] } });
},
exportData() { const w = Data.series(Shell.f().store, 'all', Shell.f().dedupe); return { name: 'app_vs_pos', sheets: [{ name: 'App vs POS', rows: [['Week start', 'Week end', 'POS pcs', 'App pcs', 'App share %'], ...w.map(x => [Core.iso(x.s), Core.iso(x.e), x.pos, x.app, x.pcs ? +(x.app / x.pcs * 100).toFixed(1) : ''])] }] }; } };
Shell.start(Page);
</script></body></html>
