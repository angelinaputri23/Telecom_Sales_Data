<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Telecom Sales — Target Planner</title><link rel="stylesheet" href="style.css"></head>
<body><div class="wrap"><div id="shell"></div><div id="page"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="core.js"></script><script src="snapshot.js"></script><script src="shared.js"></script>
<script>
const Page = { file: 'target.html', title: 'Target Planner', ch: true,
extra: '<label>Raise or lower target and stretch goal by <input type="number" id="adj" value="0" step="1" style="width:70px"> %</label>',
rows() { const f = Shell.f(), a = 1 + (+$('adj').value || 0) / 100, out = [];
  const one = (name, w) => { const fc = Core.forecast(Data.norm(w)); if (!fc) return null; const t = Math.round(fc.target * a), s = Math.round(fc.stretch * a); return { name, w, last: fc.last, trend: fc.trend, min: fc.min, t, s, mm: fc.min * 4, mt: t * 4, ms: s * 4 }; };
  for (const s of Data.stores) { const r = one(s.id + (s.dupOf ? ' ⚠' : ''), Data.series(s.id, f.ch, false)); if (r) out.push(r); }
  const all = one('All stores' + (f.dedupe ? ' (identical tabs once)' : ''), Data.series('all', f.ch, f.dedupe)); if (all) out.push(all); return out; },
render() {
  const f = Shell.f(), R = this.rows(), sel = R.find(r => r.name.startsWith(f.store === 'all' ? 'All stores' : f.store)) || R[R.length - 1];
  if (!sel) { $('page').innerHTML = '<div class="card empty">Not enough complete weeks (need at least 3).</div>'; return; }
  const done = sel.w.filter(x => x.complete), nx = done[done.length - 1].e + Core.DAY, lab = Core.iso(nx).slice(5) + ' → ' + Core.iso(nx + 6 * Core.DAY).slice(5);
  $('page').innerHTML = `<div class="kpis">${U.kpi('Minimum per week', U.n(sel.min) + ' pcs', 'the lowest you should normally expect')}${U.kpi('Target per week', U.n(sel.t) + ' pcs', 'for next week (' + lab + ')')}${U.kpi('Stretch goal per week', U.n(sel.s) + ' pcs', 'a higher goal to aim for')}${U.kpi('Target for the next 4 weeks', U.n(sel.mt) + ' pcs', 'minimum ' + U.n(sel.mm) + ' · stretch goal ' + U.n(sel.ms))}</div>
  <div class="card"><h3>${sel.name}: past weeks and next week's targets</h3><div class="ch"><canvas id="c1"></canvas></div></div>
  <div class="card sc" style="margin-top:10px"><h3>Targets by store (pcs)</h3><table><tr><th>Store</th><th>Last week</th><th>Change vs the 4 weeks before</th><th>Minimum per week</th><th>Target per week</th><th>Stretch goal per week</th><th>Minimum for next 4 weeks</th><th>Target for next 4 weeks</th><th>Stretch goal for next 4 weeks</th></tr>
  ${R.map(r => `<tr><td>${r.name}</td><td>${U.n(r.last)}</td><td>${U.pc(r.trend)}</td><td>${U.n(r.min)}</td><td><b>${U.n(r.t)}</b></td><td>${U.n(r.s)}</td><td>${U.n(r.mm)}</td><td><b>${U.n(r.mt)}</b></td><td>${U.n(r.ms)}</td></tr>`).join('')}</table>
  <div class="note"><b>How the numbers are worked out</b> (only finished weeks, each adjusted to a 7-day week): <b>Target</b> = average of the last 4 weeks, where recent weeks count more. <b>Minimum</b> = a weak-but-normal week: only 1 in 4 of the last 8 weeks was lower. <b>Stretch goal</b> = a strong week: about the best 1 in 4 of the last 8 weeks, or the target +10%, whichever is higher. "Next 4 weeks" = 4 × the weekly number. It is a starting point based on past sales, so use the % box to adjust for promos, holidays or the App/POS shift.</div></div>
  <div class="card sc" style="margin-top:10px"><h3>${sel.name}: recent weeks compared with the target</h3><table><tr><th>Week</th><th>Units sold (per 7 days)</th><th>Difference vs target (pcs)</th><th>Difference vs target (%)</th><th>Result</th></tr>${done.slice(-8).map(x => { const d = x.n7 - sel.t; const r = x.n7 >= sel.s ? ['Strong week', 'pos'] : x.n7 >= sel.t ? ['On target', 'pos'] : x.n7 >= sel.min ? ['Below target', ''] : ['Below minimum', 'neg']; return `<tr><td>${Core.iso(x.s)} → ${Core.iso(x.e)}</td><td>${U.n(x.n7)}</td><td><span class="${d >= 0 ? 'pos' : 'neg'}">${d >= 0 ? '+' : ''}${U.n(d)}</span></td><td>${U.pc(d / sel.t)}</td><td><span class="tag ${r[1]}">${r[0]}</span></td></tr>`; }).join('')}</table><div class="note">Shows how each recent week would have measured against the new target and minimum.</div></div>`;
  const L = done.map(U.lbl).concat(['Next wk']), pad = a => a.concat([null]), h = done.map(x => Math.round(x.n7)), n = h.length;
  const pt = (v, c, l) => ({ label: l, data: Array(n).fill(null).concat([v]), type: 'line', borderColor: c, backgroundColor: c, pointRadius: 7, showLine: false });
  Shell.chart('c1', { type: 'bar', data: { labels: L, datasets: [{ label: 'Actual sold (pcs per week)', data: pad(h), backgroundColor: '#2a6df4' }, pt(sel.min, '#d64545', 'Minimum'), pt(sel.t, '#16a06b', 'Target'), pt(sel.s, '#e0902b', 'Stretch')] }, options: { scales: { y: { beginAtZero: true } } } });
},
exportData() { const R = this.rows(); if (!R.length) return null; return { name: 'sales_targets', sheets: [{ name: 'Targets', rows: [['Store', 'Last week', 'Change vs the 4 weeks before %', 'Minimum per week', 'Target per week', 'Stretch goal per week', 'Minimum for next 4 weeks', 'Target for next 4 weeks', 'Stretch goal for next 4 weeks'], ...R.map(r => [r.name, r.last, r.trend == null ? '' : +(r.trend * 100).toFixed(1), r.min, r.t, r.s, r.mm, r.mt, r.ms])] },
  { name: 'Past weeks', rows: [['Store', 'Week start', 'Week end', 'Units sold', 'Week finished?'], ...R.flatMap(r => r.w.map(x => [r.name, Core.iso(x.s), Core.iso(x.e), x.pcs, x.complete ? 'yes' : 'no']))] }] }; } };
Shell.start(Page);
</script></body></html>
