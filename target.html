<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Telecom Sales — Target Planner</title><link rel="stylesheet" href="style.css"></head>
<body><div class="wrap"><div id="shell"></div><div id="page"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="core.js"></script><script src="snapshot.js"></script><script src="shared.js"></script>
<script>
const KEY = 'telecomTargets';
const Page = { file: 'target.html', title: 'Target Planner', ch: true,
extra: '<label>Raise or lower the suggested target by <input type="number" id="adj" value="0" step="1" style="width:70px"> %</label><button id="bFill">Copy suggested → my targets</button><button id="bReset">Clear my targets</button>',
mine() { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } },
save(k, v) { const m = this.mine(); if (v === '' || isNaN(+v)) delete m[k]; else m[k] = Math.round(+v); localStorage.setItem(KEY, JSON.stringify(m)); },
rows() { const f = Shell.f(), a = 1 + (+$('adj').value || 0) / 100, M = this.mine(), out = [], avg = x => x.reduce((p, q) => p + q, 0) / (x.length || 1);
  const one = (key, name, w) => { const norm = Data.norm(w), fc = Core.forecast(norm); if (!fc) return null;
    const t = Math.round(fc.target * a), s = Math.round(fc.stretch * a), my = M[key] != null ? M[key] : null, eff = my != null ? my : t;
    const n = norm.length, prev = n > 1 ? norm[n - 2] : null, wow = prev ? norm[n - 1] / prev - 1 : null, dif = prev != null ? norm[n - 1] - prev : null;
    const l4 = norm.slice(-4), a4 = avg(l4), hit = l4.filter(v => v >= eff).length, gap = eff ? a4 / eff - 1 : 0;
    let adv = 'Keep', sug = eff;
    if (hit >= 3 && gap >= 0.05) { adv = 'Raise'; sug = Math.round(a4 * 1.05); } else if (hit <= 1 && gap <= -0.05) { adv = 'Lower'; sug = Math.round(a4); }
    return { key, name, w, last: fc.last, wow, dif, min: fc.min, sugg: t, my, t: eff, s: Math.max(s, eff), mt: eff * 4, hit, n4: l4.length, a4, gap, adv, sug }; };
  for (const s of Data.stores) { const r = one(s.id, s.id + (s.dupOf ? ' ⚠' : ''), Data.series(s.id, f.ch, false)); if (r) out.push(r); }
  const all = one('all', 'All stores' + (f.dedupe ? ' (identical tabs once)' : ''), Data.series('all', f.ch, f.dedupe)); if (all) out.push(all); return out; },
render() {
  const f = Shell.f(), R = this.rows(), key = f.store === 'all' ? 'all' : f.store, sel = R.find(r => r.key === key) || R[R.length - 1];
  if (!sel) { $('page').innerHTML = '<div class="card empty">Not enough complete weeks (need at least 3).</div>'; return; }
  const done = sel.w.filter(x => x.complete), nx = done[done.length - 1].e + Core.DAY, lab = U.wk({ s: nx, e: nx + 6 * Core.DAY });
  const D = v => `<span class="${v >= 0 ? 'pos' : 'neg'}">${v >= 0 ? '+' : ''}${U.n(v)}</span>`;
  const advTag = r => { const c = r.adv === 'Raise' ? 'pos' : r.adv === 'Lower' ? 'neg' : ''; const ic = r.adv === 'Raise' ? '▲ Raise' : r.adv === 'Lower' ? '▼ Lower' : '● Keep';
    return `<span class="tag ${c}">${ic}</span>${r.adv !== 'Keep' ? `<small>≈ ${U.n(r.sug)} / week</small>` : ''}`; };
  const wkRows = done.slice(-12).map(x => { const idx = done.indexOf(x), p = idx ? done[idx - 1] : null, d = p ? x.n7 - p.n7 : null, dt = x.n7 - sel.t;
    const r = x.n7 >= sel.t && x.n7 >= sel.s ? ['Strong week', 'pos'] : x.n7 >= sel.t ? ['On target', 'pos'] : x.n7 >= sel.min ? ['Below target', ''] : ['Below minimum', 'neg'];
    return `<tr><td>${U.wk(x)}${x.days !== 7 ? '*' : ''}</td><td>${U.n(x.n7)}</td><td>${d == null ? '–' : D(d)}</td><td>${p && p.n7 ? U.pc(x.n7 / p.n7 - 1) : '–'}</td><td>${D(dt)}</td><td>${U.pc(dt / sel.t)}</td><td><span class="tag ${r[1]}">${r[0]}</span></td></tr>`; }).reverse().join('');
  const mine = sel.my != null;
  $('page').innerHTML = `<div class="kpis">${U.kpi('Last week (' + U.wk(done[done.length - 1]) + ')', U.n(sel.last) + ' pcs', sel.wow == null ? '' : 'vs the week before: ' + (sel.dif >= 0 ? '+' : '') + U.n(sel.dif) + ' pcs (' + U.pc(sel.wow) + ')')}${U.kpi(mine ? 'Your target per week' : 'Target per week (suggested)', U.n(sel.t) + ' pcs', 'for next week (' + lab + ')' + (mine ? ' · suggested ' + U.n(sel.sugg) : ''))}${U.kpi('Minimum / Stretch per week', U.n(sel.min) + ' / ' + U.n(sel.s) + ' pcs', 'weak-but-normal week / strong week')}${U.kpi('Target for the next 4 weeks', U.n(sel.mt) + ' pcs', U.n(sel.t / 7) + ' pcs per day')}${U.kpi('Advice for ' + sel.name, advTag(sel), 'weeks that hit the target (last 4): ' + sel.hit + ' of ' + sel.n4)}</div>
  <div class="card"><h3>${sel.name}: past weeks and next week's target</h3><div class="ch"><canvas id="c1"></canvas></div></div>
  <div class="card sc" style="margin-top:10px"><h3>Targets by store (pcs per week) — type your own target in the box</h3><table><tr><th>Store</th><th>Last week</th><th>Change vs previous week (pcs)</th><th>Change vs previous week (%)</th><th>Minimum</th><th>Suggested target</th><th>Your target</th><th>Stretch</th><th>Your target × 4 weeks</th><th>Hit target (last 4 weeks)</th><th>Avg last 4 weeks vs target</th><th>Advice</th></tr>
  ${R.map(r => `<tr><td>${r.name}</td><td>${U.n(r.last)}</td><td>${r.dif == null ? '–' : D(r.dif)}</td><td>${U.pc(r.wow)}</td><td>${U.n(r.min)}</td><td>${U.n(r.sugg)}</td><td><input class="mine" data-k="${r.key}" inputmode="numeric" value="${r.my != null ? r.my : ''}" placeholder="${r.sugg}" style="width:80px;text-align:right;font-weight:700"></td><td>${U.n(r.s)}</td><td><b>${U.n(r.mt)}</b></td><td>${r.hit} of ${r.n4}</td><td>${U.pc(r.gap)}</td><td>${advTag(r)}</td></tr>`).join('')}</table>
  <div class="note"><b>Your target</b> is saved in this browser. Leave it empty to use the suggested target. <b>Advice</b> looks at the last 4 finished weeks against the target that is in use: <b>Raise</b> = 3 or 4 of them hit it and the average is at least 5% above it; <b>Lower</b> = only 0 or 1 hit it and the average is at least 5% below it; otherwise <b>Keep</b>. The “≈” number is the average of the last 4 weeks (+5% when raising).
  <br><b>How the suggested numbers are worked out</b> (finished weeks only, each adjusted to a 7-day week): <b>Target</b> = average of the last 4 weeks, recent weeks count more. <b>Minimum</b> = only 1 in 4 of the last 8 weeks was lower. <b>Stretch</b> = about the best 1 in 4 of the last 8 weeks, or the target +10%, whichever is higher. ${U.foot}</div></div>
  <div class="card sc" style="margin-top:10px"><h3>${sel.name}: week by week (newest first) — how each week compares with the week before and with the target</h3><table><tr><th>Week</th><th>Units sold (per 7 days)</th><th>Change vs previous week (pcs)</th><th>Change vs previous week (%)</th><th>Difference vs ${mine ? 'your ' : ''}target (pcs)</th><th>Difference vs target (%)</th><th>Result</th></tr>${wkRows}</table>
  <div class="note">Use this to decide: if most recent weeks are “On target” or “Strong week”, the target can go up; if most are “Below minimum”, it is probably too high.</div></div>`;
  const L = done.map(U.lbl).concat(['Next wk']), pad = a => a.concat([null]), h = done.map(x => Math.round(x.n7)), n = h.length;
  const pt = (v, c, l) => ({ label: l, data: Array(n).fill(null).concat([v]), type: 'line', borderColor: c, backgroundColor: c, pointRadius: 7, showLine: false });
  Shell.chart('c1', { type: 'bar', data: { labels: L, datasets: [{ label: 'Actual sold (pcs per week)', data: pad(h), backgroundColor: '#2a6df4' }, pt(sel.min, '#d64545', 'Minimum'), pt(sel.t, '#16a06b', mine ? 'Your target' : 'Target'), pt(sel.s, '#e0902b', 'Stretch')] }, options: { scales: { y: { beginAtZero: true } } } });
  const self = this;
  document.querySelectorAll('.mine').forEach(i => i.oninput = () => { const k = i.dataset.k, v = i.value.replace(/[^\d]/g, ''); self.save(k, v); self.render();
    const j = document.querySelector('.mine[data-k="' + k + '"]'); if (j) { j.focus(); j.setSelectionRange(j.value.length, j.value.length); } });
  $('bReset').onclick = () => { localStorage.removeItem(KEY); self.render(); };
  $('bFill').onclick = () => { const M = {}; self.rows().forEach(r => M[r.key] = r.sugg); localStorage.setItem(KEY, JSON.stringify(M)); self.render(); };
},
exportData() { const R = this.rows(); if (!R.length) return null; return { name: 'sales_targets', sheets: [{ name: 'Targets', rows: [['Store', 'Last week', 'Change vs previous week (pcs)', 'Change vs previous week %', 'Minimum per week', 'Suggested target per week', 'Your target per week', 'Target in use per week', 'Stretch goal per week', 'Target in use x 4 weeks', 'Weeks that hit target (last 4)', 'Advice'], ...R.map(r => [r.name, r.last, r.dif == null ? '' : Math.round(r.dif), r.wow == null ? '' : +(r.wow * 100).toFixed(1), r.min, r.sugg, r.my == null ? '' : r.my, r.t, r.s, r.mt, r.hit + ' of ' + r.n4, r.adv])] },
  { name: 'Past weeks', rows: [['Store', 'Week start', 'Week end', 'Units sold', 'Week finished?'], ...R.flatMap(r => r.w.map(x => [r.name, Core.iso(x.s), Core.iso(x.e), x.pcs, x.complete ? 'yes' : 'no']))] }] }; } };
Shell.start(Page);
</script></body></html>
