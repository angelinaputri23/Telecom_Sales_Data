  return`<div class="filters">${storeSel()}${carrierSel()}${weekSel()}<label>Search product<input data-k="q" value="${esc(S.q)}" placeholder="e.g. 499 or FarEasTone"></label>${onceBox()}</div>
  ${help('p1','What do these numbers mean?','Each product for the week you pick, compared with the week right before it. Products that sold fewer than 3 cards in both weeks are left out of the “selling more / less” lists because tiny numbers jump around a lot.')}
  <div class="grid">${card('📈 Selling more than the week before · '+wl(cw.ws,cw.we),li(up))}${card('📉 Selling less than the week before',li(dn))}</div>
  ${card('All products · '+wl(cw.ws,cw.we)+' ('+shown.length+')',tbl(['Product','Phone company','Type','Cards sold','Week before','Change','Total (all weeks)'],shown.map(x=>[esc(x.r.label)+'<br><small>'+x.r.id+'</small>',esc(x.r.carrier),esc(x.r.kind),'<b>'+f0(x.q)+'</b>',f0(x.p),x.p?chg(x.q,x.p):(x.q?'<span class="tag">new</span>':'–'),f0(x.all)],),[3,4,5,6]))}`}
/* ---------- 5. DATA CHECK ---------- */
function tabCheck(){const ch=Object.entries(D.checks);
  const rows=ch.map(([s,v])=>{const bad=v.checks.filter(c=>c.totNa!==null&&Math.round(c.rowsNa)!==Math.round(c.totNa)).length,fx=v.checks.filter(c=>c.fixed).length;
    return[`<b>${esc(s)}</b>`,esc(v.tab),v.checks.length,f0(sum(D.recs.filter(r=>r.store===s),r=>r.nq)),money(sum(D.recs.filter(r=>r.store===s),r=>r.na)),bad?`<span class="tag no">${bad} week(s) do not add up</span>`:'<span class="tag ok">adds up</span>',fx?'<span class="tag mid">date range adjusted</span>':'–',D.dupOf[s]?`<span class="tag no">same as ${esc(D.dupOf[s])}</span>`:'–']});
  const rets=D.recs.filter(r=>r.rq>0);
  return`<div class="card" style="margin-bottom:12px"><h3>Is the data OK?</h3>${tbl(['Branch','Sheet tab','Weeks','Cards sold','Sales','Totals check','Dates','Duplicate check'],rows,[2,3,4])}</div>
  ${help('c1','What is checked?','<b>Totals check</b> adds up the product lines of each week and compares them with the 合計 (total) line of your report. <b>Duplicate check</b> finds branches whose numbers are exactly the same in every week. <b>Dates</b> tells you if a date range had to be adjusted.')}
  <div class="grid">${card('Which sheet tab is which branch',tbl(['Sheet tab','Branch'],CONFIG.STORES.map(s=>[esc(s.tab),esc(s.name)]))+'<div class="note warn">Daxue (811001 DT) and Hunei (829001 FN) were matched by postal code (811 = Nanzi, 829 = Hunei). Please check, and change <code>STORES</code> in CONFIG if wrong.</div>')}
  ${card('Returns',rets.length?tbl(['Branch','Week','Product','Cards','Amount'],rets.map(r=>[esc(r.store),wl(r.ws,r.we),esc(r.label),f0(r.rq),money(r.ra)]),[3,4]):'<small>No returns in the data.</small>')}</div>`}
/* ---------- render ---------- */
function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab==S.tab));
  if(!D.recs.length){$('#app').innerHTML='<div class="note warn">No data yet. Click “Upload file” or “Refresh data”.</div>';return}
  const fn={week:tabWeek,target:tabTarget,branch:tabBranch,prod:tabProd,check:tabCheck}[S.tab];
  const a=document.activeElement,fk=a&&a.tagName==='INPUT'&&a.type!=='checkbox'?(a.dataset.key?'key:'+a.dataset.key:'k:'+a.dataset.k):null;
  $('#app').innerHTML=banner()+fn();
  if(fk){const i=fk.startsWith('key:')?document.querySelector('input.mine[data-key="'+fk.slice(4)+'"]'):document.querySelector('input[data-k="'+fk.slice(2)+'"]');if(i){i.focus();try{i.setSelectionRange(i.value.length,i.value.length)}catch(e){}}}
  const f=$('#bFill'),c=$('#bClear');
  if(f)f.onclick=()=>{[...D.stores,'all'].forEach(k=>{const t=tgt(k==='all'?D.recs.filter(r=>(!S.carrier||r.carrier===S.carrier)&&(!S.once||!D.dupOf[r.store])):D.recs.filter(r=>r.store===k&&(!S.carrier||r.carrier===S.carrier)),k,k);if(t)mineSet(k,t.sugg)});render()};
  if(c)c.onclick=()=>{try{localStorage.removeItem('telecomTargets')}catch(e){}render()}}
/* ---------- loading ---------- */
function stamp(){$('#status').textContent='Source: '+SRC+(D.weeks.length?' · data from '+dm(D.weeks[0].ws)+' to '+dm(D.weeks[D.weeks.length-1].we)+' '+D.weeks[D.weeks.length-1].we.slice(0,4):'')+' · updated '+new Date().toLocaleString('en-GB')}
async function load(manual){const btn=$('#refresh');btn.disabled=true;$('#status').textContent='Loading data…';
  try{let snap={};try{snap=JSON.parse($('#embedded').textContent)}catch(e){}
    if(!Object.keys(snap).length)try{snap=await (await fetch('data/snapshot.json?'+Date.now())).json()}catch(e){}
    let sheets=snap,src='built-in data (from the Excel file)';
    if(CONFIG.SHEET_ID&&(manual||CONFIG.AUTO_LIVE)){const L={},fail=[];await Promise.all(CONFIG.STORES.map(async s=>{try{const t=await live(s.tab);if(isStoreTab(t))L[s.tab]=t;else fail.push(s.tab)}catch(e){fail.push(s.tab)}}));
      if(Object.keys(L).length&&!fail.length){sheets=L;src='Google Sheets (live)'}
      else if(Object.keys(L).length){sheets={...snap,...L};src='Google Sheets, but these tabs could not be read and use built-in data: '+fail.join(', ')}
      else src='⚠ Google Sheets could not be read (check that it is shared as “Anyone with the link – Viewer”) – showing built-in data'}
    LAST=sheets;SRC=src;build(sheets);render();stamp()}catch(e){$('#status').textContent='Error: '+e.message}
  btn.disabled=false}
async function onFile(f){if(!f)return;$('#status').textContent='Reading '+f.name+'…';
  try{const sheets=await readXlsx(await f.arrayBuffer()),ok=Object.keys(sheets).filter(k=>isStoreTab(sheets[k]));if(!ok.length)throw Error('no sheet with the columns 商品編號 and 銷售淨額 was found');
    LAST=sheets;SRC='uploaded file “'+f.name+'”';build(sheets);render();stamp();$('#upMsg').innerHTML=`<div class="note"><b>Loaded:</b> ${ok.map(esc).join(' · ')} <button onclick="this.parentNode.remove()" style="float:right;padding:0 8px">✕</button></div>`}
  catch(e){$('#upMsg').innerHTML=`<div class="note warn"><b>Could not read the file:</b> ${esc(e.message)} <button onclick="this.parentNode.remove()" style="float:right;padding:0 8px">✕</button></div>`;stamp()}}
document.addEventListener('click',e=>{const b=e.target.closest('#nav button');if(b){S.tab=b.dataset.tab;render()}});
document.addEventListener('change',e=>{const t=e.target,k=t.dataset&&t.dataset.k;if(!k)return;if(t.type==='checkbox'){S[k]=t.checked;render()}else if(t.tagName==='SELECT'){S[k]=t.value;render()}});
document.addEventListener('input',e=>{const t=e.target;if(t.classList&&t.classList.contains('mine')){mineSet(t.dataset.key,t.value.replace(/[^\d]/g,''));render();return}
  if(t.tagName==='INPUT'&&t.type==='text'&&t.dataset.k){S[t.dataset.k]=t.value;render()}});
$('#refresh').onclick=()=>load(true);$('#upBtn').onclick=()=>$('#fileIn').click();$('#fileIn').onchange=e=>{onFile(e.target.files[0]);e.target.value=''};
if(CONFIG.SHEET_ID)$('#gs').href='https://docs.google.com/spreadsheets/d/'+CONFIG.SHEET_ID+'/edit';else $('#gs').style.display='none';
load(false);
</script></body></html>
