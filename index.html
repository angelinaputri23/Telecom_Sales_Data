<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Telecom Sales — Weekly Sales</title><link rel="stylesheet" href="style.css"></head>
<body><div class="wrap"><div id="shell"></div><div id="page"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="core.js"></script><script src="snapshot.js"></script><script src="shared.js"></script>
<script>
const Page = { file: 'index.html', title: 'Weekly Sales', ch: true,
render() {
  const f = Shell.f(), w = Data.series(f.store, f.ch, f.dedupe), done = w.filter(x => x.complete);
  const last = done[done.length - 1], prev = done[done.length - 2], l4 = done.slice(-4);
  const avg4 = l4.length ? l4.reduce((a, x) => a + x.n7, 0) / l4.length : 0, tot = w.reduce((a, x) => a + x.pcs, 0);
  const stack = f.ch === 'all' && Data.hasApp, keys = [...new Set(w.flatMap(x => Object.keys(x.carrier)))];
  const all = [...new Set(Data.stores.flatMap(s => ['pos', 'app'].flatMap(c => s[c] ? [...s[c].keys()] : [])))].sort((a, b) => a - b);
  const D = v => `<span class="${v >= 0 ? 'pos' : 'neg'}">${v >= 0 ? '+' : ''}${U.n(v)}</span>`;
  const per = Data.stores.map(s => new Map(Data.series(s.id, f.ch, false).map(x => [x.s, x])));
  const rows = w.map((x, i) => `<tr><td>${U.wk(x)}${x.complete ? '' : ' †'}</td>${per.map(m => { const c = m.get(x.s), p = i ? m.get(w[i - 1].s) : null; return c ? `<td>${U.n(c.pcs)}${p && p.n7 ? `<small>${U.pc(c.n7 / p.n7 - 1)}</small>` : ''}</td>` : '<td>–</td>'; }).join('')}<td><b>${U.n(x.pcs)}</b>${i && w[i - 1].n7 ? `<small>${U.pc(x.n7 / w[i - 1].n7 - 1)}</small>` : ''}</td></tr>`).join('');
  const pal = ['#2a6df4', '#16a06b', '#e0902b', '#d64545', '#8a5cf5', '#18a5b8'];
  $('page').innerHTML = `<div class="kpis">${U.kpi('Last complete week (' + (last ? U.wk(last) : '–') + ')', last ? U.n(last.pcs) + ' pcs' : '–', prev ? 'compared with the week before: ' + U.pc(last.n7 / prev.n7 - 1) : '')}
    ${U.kpi('Average of the last 4 complete weeks', U.n(avg4) + ' pcs per week', 'adjusted to a 7-day week')}${U.kpi('Total sold in the data', U.n(tot) + ' pcs', w.length + ' weeks')}</div>
    <div class="grid"><div class="card"><h3>Units sold per week (pcs)</h3><div class="ch"><canvas id="c1"></canvas></div></div>
    <div class="card"><h3>Store comparison (pcs per week)</h3><div class="ch"><canvas id="c2"></canvas></div></div></div>
    <div class="grid"><div class="card"><h3>By phone company</h3><div class="ch"><canvas id="c3"></canvas></div></div>
    <div class="card sc"><h3>Week-by-week table</h3><table><tr><th>Week</th><th>Days</th><th>Units sold</th><th>Per day</th><th>Sales amount (NT$)</th><th>Change vs last week (pcs)</th><th>Change vs last week (%)</th></tr>
    ${w.map((x, i) => `<tr><td>${U.wk(x)}${x.complete ? '' : ' †'}</td><td>${x.days}</td><td>${U.n(x.pcs)}</td><td>${(x.pcs / x.days).toFixed(1)}</td><td>${U.n(x.amt)}</td><td>${i ? D(x.n7 - w[i - 1].n7) : '–'}</td><td>${i ? U.pc(x.n7 / w[i - 1].n7 - 1) : '–'}</td></tr>`).join('')}</table>
    <div class="note">${U.foot}</div></div></div>
    <div class="card sc"><h3>Compare stores week by week</h3><table><tr><th>Week</th>${Data.stores.map(s => `<th>${s.id}${s.dupOf ? ' ≈' : ''}</th>`).join('')}<th>${f.store === 'all' ? 'Total' : 'Selected'}</th></tr>${rows}</table><div class="note">Each cell: pcs sold, then the change vs the same store's previous week. ≈ = same numbers as another store (probably placeholder data). ${U.foot}</div></div>`;
  const labels = w.map(U.lbl);
  Shell.chart('c1', { type: 'bar', data: { labels, datasets: stack ? [{ label: 'POS', data: w.map(x => x.pos), backgroundColor: pal[0] }, { label: 'App', data: w.map(x => x.app), backgroundColor: pal[1] }] : [{ label: 'Pcs', data: w.map(x => x.pcs), backgroundColor: pal[0] }] }, options: { scales: { x: { stacked: stack }, y: { stacked: stack, beginAtZero: true } } } });
  Shell.chart('c2', { type: 'line', data: { labels: all.map(k => U.d(k)), datasets: Data.stores.map((s, i) => { const m = new Map(Data.series(s.id, f.ch, false).map(x => [x.s, x.pcs]));
    return { label: s.id + (s.dupOf ? ' (=' + s.dupOf + ')' : ''), data: all.map(k => m.get(k) ?? null), borderColor: pal[i % 6], borderDash: s.dupOf ? [5, 4] : [], tension: .25, pointRadius: 2 }; }) } });
  Shell.chart('c3', { type: 'bar', data: { labels, datasets: keys.map((k, i) => ({ label: k, data: w.map(x => x.carrier[k] || 0), backgroundColor: pal[i % 6] })) }, options: { scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true } } } });
},
exportData() { const f = Shell.f(), w = Data.series(f.store, f.ch, f.dedupe); return { name: 'weekly_sales_' + f.store.replace(/\W+/g, '_'), sheets: [{ name: 'Week by week', rows: [['Week start', 'Week end', 'Days', 'Units sold', 'POS units', 'App units', 'Units per 7 days', 'Sales amount', 'Week finished?'], ...w.map(x => [Core.iso(x.s), Core.iso(x.e), x.days, x.pcs, x.pos, x.app, +x.n7.toFixed(1), x.amt, x.complete ? 'yes' : 'no'])] }, { name: 'Stores by week', rows: [['Week start', ...Data.stores.map(s => s.id), 'Total'], ...w.map(x => [Core.iso(x.s), ...Data.stores.map(s => { const c = Data.series(s.id, f.ch, false).find(y => y.s === x.s); return c ? c.pcs : ''; }), x.pcs])] }] }; } };
Shell.start(Page);
</script></body></html>
